<!DOCTYPE html>
<html>

<head>
  <title>Woy Woy | Linden Li</title>

  <style>
    body {
      background: #111;
      color: white;
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
    }

    nav {
      text-align: center;
      margin: 18px 0 30px 0;
      font-family: Arial, sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    nav a {
      color: #aaa;
      text-decoration: none;
      margin: 0 14px;
    }

    nav a:hover {
      color: white;
    }

    h1 {
      text-align: center;
      font-weight: normal;
      font-size: 2.2rem;
      margin: 45px 0 60px 0;
      letter-spacing: 0.04em;
    }

    .gallery {
      max-width: 1200px;
      margin: 0 auto 90px auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .gallery > img {
      width: 100%;
      aspect-ratio: 1 / 1;
      height: auto;
      object-fit: cover;
      display: block;
      cursor: pointer;
      transition: opacity 0.25s ease;
    }

    .gallery > img:hover {
      opacity: 0.82;
    }

    .lightbox {
      display: flex;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.95);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease, visibility 0.25s ease;
    }

    .lightbox.show {
      opacity: 1;
      visibility: visible;
    }

    .lightbox img {
      max-width: 92vw;
      max-height: 92vh;
      width: auto;
      height: auto;
      aspect-ratio: auto;
      object-fit: contain;
      display: block;
    }

    @media (max-width: 800px) {
      .gallery {
        grid-template-columns: repeat(2, 1fr);
        gap: 14px;
      }
    }

    @media (max-width: 600px) {
      nav {
        font-size: 0.72rem;
      }

      nav a {
        margin: 0 7px;
      }

      h1 {
        font-size: 1.8rem;
        margin: 34px 0 42px 0;
      }

      .gallery {
        padding: 0 14px;
        gap: 12px;
      }
    }
  </style>
</head>

<body>

<nav>
  <a href="index.html">Photographs</a>
  <a href="writing.html">Writing</a>
  <a href="birding.html">Birding</a>
  <a href="about.html">About</a>
</nav>

<h1>Woy Woy</h1>

<div class="gallery">

  <img src="images/birding/woywoy_cover.JPG" alt="Pelicans at Woy Woy" onclick="openLightbox(this.src)">
  <img src="images/birding/woywoy_01.jpg" alt="Pelicans at Woy Woy" onclick="openLightbox(this.src)">
  <img src="images/birding/woywoy_02.jpg" alt="Pelicans at Woy Woy" onclick="openLightbox(this.src)">
  <img src="images/birding/woywoy_03.jpg" alt="Pelican reflection at Woy Woy" onclick="openLightbox(this.src)">
  <img src="images/birding/woywoy_08.jpg" alt="Side profile pelican at Woy Woy" onclick="openLightbox(this.src)">
  <img src="images/birding/woywoy_06.JPG" alt="Pelican on water at Woy Woy" onclick="openLightbox(this.src)">
  <img src="images/birding/woywoy_05.jpg" alt="Pelicans at Woy Woy" onclick="openLightbox(this.src)">
  <img src="images/birding/woywoy_04.jpg" alt="Pelicans at Woy Woy" onclick="openLightbox(this.src)">
  <img src="images/birding/woywoy_09.jpg" alt="Two Pelicans" onclick="openLightbox(this.src)">

</div>

<div id="lightbox" class="lightbox" onclick="closeLightbox()">
  <img id="lightbox-img" src="" alt="">
</div>

<script>
function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('show');
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('show');
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    closeLightbox();
  }
});
</script>

</body>
</html>
